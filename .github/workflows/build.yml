name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.linkage }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        build_shared_libs:
          - "ON"
          - "OFF"
        include:
          - build_shared_libs: "ON"
            linkage: dynamic
          - build_shared_libs: "OFF"
            linkage: static

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake
          -S .
          -B build/${{ matrix.linkage }}
          -DBUILD_SHARED_LIBS=${{ matrix.build_shared_libs }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/${{ matrix.linkage }} --config Release
